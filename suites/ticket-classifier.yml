# Fictional/sample data for an independent portfolio project.
schema_version: 1
data_label: fictional_sample
policy:
  aggregate_drop_points: 5
id: ticket-classifier
name: Support ticket classifier
feature:
  prompt: prompts/classifier/v1.txt
  prompt_version: v1-ci-proof
  model: mock/ticket-classifier-v1
  generation:
    temperature: 0
    max_tokens: 120
cases:
- id: refund
  input: Please refund my purchase.
  expected_behavior: Return billing, normal.
  severity: standard
  checks:
  - type: json_schema
    schema:
      type: object
      required:
      - category
      - priority
      additionalProperties: false
      properties:
        category:
          const: billing
        priority:
          const: normal
