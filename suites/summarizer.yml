# Fictional/sample data for an independent portfolio project.
schema_version: 1
data_label: fictional_sample
policy:
  aggregate_drop_points: 5
id: summarizer
name: Short text summarizer
feature:
  prompt: prompts/summarizer/v1.txt
  prompt_version: v1
  model: mock/summarizer-v1
  generation:
    temperature: 0
cases:
- id: summary-1
  input: The outage affected 12 accounts. Recovery is ongoing.
  expected_behavior: The outage affected 12 accounts.
  severity: standard
  checks:
  - type: exact_match
    expected: The outage affected 12 accounts.
  - type: contains
    keywords:
    - outage
  - type: regex
    pattern: ^[A-Z].*\.$
  - type: semantic_similarity
    reference: The outage affected 12 accounts.
    threshold: 0.8
  - type: llm_judge
    rubric: 'Preserve the supplied reference: The outage affected 12 accounts.'
    rubric_version: v1
    threshold: 0.8
